<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Histórico das Loterias CAIXA</title>
<style>
:root{
  --bg:#f6f5f1; --card:#ffffff; --ink:#1c1b19; --muted:#6b675f; --line:#e3e0d8;
  --accent:#1f6f4a; --accent-2:#b4540a; --warn-bg:#fff4d6; --warn-ink:#6b4a00;
  --c1:#1f6f4a; --c2:#c9822b; --c3:#3a6ea5; --c4:#8a4f9e; --c5:#b0453a; --c6:#5c6b73;
  --l-megasena:#1f8a4c; --l-lotofacil:#8a4f9e; --l-quina:#3a6ea5; --l-lotomania:#c9822b; --l-duplasena:#b0453a;
  --l-timemania:#a08c00; --l-diadesorte:#8b5e3c; --l-supersete:#5c6b73; --l-maismilionaria:#17858f;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14130f; --card:#1d1c17; --ink:#ece9e0; --muted:#a29d90; --line:#34312a;
    --accent:#4fb283; --accent-2:#e39a4e; --warn-bg:#3a2f10; --warn-ink:#f1d78a;
    --c1:#4fb283; --c2:#e0a04a; --c3:#6fa3da; --c4:#b88ad0; --c5:#e17a6d; --c6:#93a3ab;
    --l-megasena:#4fb283; --l-lotofacil:#b88ad0; --l-quina:#6fa3da; --l-lotomania:#e0a04a; --l-duplasena:#e17a6d;
    --l-timemania:#d9c441; --l-diadesorte:#c49a77; --l-supersete:#93a3ab; --l-maismilionaria:#4bc0c8;
  }
}
:root[data-theme="dark"]{
  --bg:#14130f; --card:#1d1c17; --ink:#ece9e0; --muted:#a29d90; --line:#34312a;
  --accent:#4fb283; --accent-2:#e39a4e; --warn-bg:#3a2f10; --warn-ink:#f1d78a;
  --c1:#4fb283; --c2:#e0a04a; --c3:#6fa3da; --c4:#b88ad0; --c5:#e17a6d; --c6:#93a3ab;
  --l-megasena:#4fb283; --l-lotofacil:#b88ad0; --l-quina:#6fa3da; --l-lotomania:#e0a04a; --l-duplasena:#e17a6d;
  --l-timemania:#d9c441; --l-diadesorte:#c49a77; --l-supersete:#93a3ab; --l-maismilionaria:#4bc0c8;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:1150px;margin:0 auto;padding:24px 16px 64px}
header{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between;margin-bottom:16px}
h1{font-size:24px;margin:0;letter-spacing:-.01em}
h2{font-size:16px;margin:0 0 12px}
.sub{color:var(--muted);font-size:13px}
.banner{background:var(--warn-bg);color:var(--warn-ink);border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}

.filter-panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
.filter-title{font-size:14px;font-weight:600;margin-bottom:10px}
.checkbox-group{display:flex;flex-wrap:wrap;gap:10px 16px;margin-bottom:12px}
.checkbox-item{display:inline-flex;align-items:center;gap:6px;font-size:14px;cursor:pointer;user-select:none}
.checkbox-item input[type="checkbox"]{accent-color:var(--accent);width:16px;height:16px;cursor:pointer}
.checkbox-item .dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;font:inherit;font-size:13px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:focus-visible,.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.year-filter{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center;padding-top:12px;border-top:1px dashed var(--line)}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:transparent;color:var(--ink);padding:7px 14px;font:inherit;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.controls{display:flex;flex-wrap:wrap;gap:12px;margin:12px 0 16px;align-items:center}
.resumo{margin-bottom:12px;font-size:15px;line-height:1.6;border-left:4px solid var(--accent)}
.resumo b{font-variant-numeric:tabular-nums}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:16px}
.kpi .v{font-size:22px;font-weight:650;letter-spacing:-.01em;font-variant-numeric:tabular-nums;color:var(--accent)}
.kpi .v-sub{font-size:13px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .l{color:var(--muted);font-size:13px;font-weight:600}
.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.cardhead{display:flex;flex-wrap:wrap;gap:8px 12px;justify-content:space-between;align-items:center;margin-bottom:12px}
.cardhead h2{margin:0}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--muted);font-size:11px;font-family:inherit}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.legend .hot{cursor:help;border-bottom:1px dotted var(--muted)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
th,td{padding:7px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:600;font-size:12px;position:sticky;top:0;background:var(--card)}
.scroll{overflow:auto;max-height:420px}
input[type=search], input[type=number], select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
input[type=number]{width:110px}
input[type=search]{min-width:200px;max-width:100%}
a{color:var(--accent)}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 10px;border-radius:8px;font-size:12px;line-height:1.45;display:none;z-index:10;white-space:pre-line;max-width:min(340px,calc(100vw - 16px))}
.note{color:var(--muted);font-size:12px;margin-top:10px}
.donut-pct{fill:#fff;font-size:12px;font-weight:700;paint-order:stroke;stroke:rgba(0,0,0,.5);stroke-width:2.5px;stroke-linejoin:round}
.donut-total{fill:var(--ink);font-size:17px;font-weight:700}
.donut-sub{fill:var(--muted);font-size:11px}
.slice{cursor:help}
.mk{cursor:help}
.badge{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:600;line-height:1.5;
  color:var(--lc);background:color-mix(in srgb,var(--lc) 16%,transparent);border:1px solid color-mix(in srgb,var(--lc) 40%,transparent)}
.r100{display:flex;height:34px;border-radius:8px;overflow:hidden;margin-top:12px;gap:2px}
.r100 div{display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;min-width:2px;cursor:help;text-shadow:0 0 3px rgba(0,0,0,.55)}
.sim-in{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:end;margin-bottom:14px}
.sim-in label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
.sim-out{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.sim-out .cell{border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.sim-out .l{font-size:12px;color:var(--muted);font-weight:600}
.sim-out .v{font-size:19px;font-weight:650;font-variant-numeric:tabular-nums;color:var(--accent);overflow-wrap:anywhere}
.sim-out .d{font-size:12px;color:var(--muted);margin-top:2px}
@media (max-width:520px){ input[type=number]{width:100%} .sim-in label{flex:1 1 130px} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Histórico das Loterias CAIXA</h1>
    <div class="sub" id="atualizado"></div>
  </header>

  <div class="filter-panel">
    <div class="filter-title">Selecione as Loterias para Analisar:</div>
    <div class="btnrow" id="atalhosLot">
      <button class="btn" id="btnTodas" type="button">TODAS AS LOTERIAS</button>
      <button class="btn" id="btnPrincipais" type="button">Apenas Principais</button>
      <button class="btn" id="btnLimpar" type="button">Limpar Seleção</button>
    </div>
    <div class="checkbox-group" id="lotteryCheckboxes"></div>

    <div class="year-filter">
      <span style="font-weight:600;font-size:13px;">Período (Ano):</span>
      <label class="sub">De: <input type="number" id="anoDe" placeholder="Ex: 1994" min="1994" max="2100"></label>
      <label class="sub">Até: <input type="number" id="anoAte" placeholder="Ex: 2026" min="1994" max="2100"></label>
      <span class="btnrow" id="presets" style="margin:0">
        <button class="btn" type="button" data-p="5">Últimos 5 Anos</button>
        <button class="btn" type="button" data-p="10">Últimos 10 Anos</button>
        <button class="btn" type="button" data-p="todo">Todo o Histórico</button>
      </span>
    </div>
  </div>

  <div id="banner"></div>
  <div class="card empty" id="vazio" hidden>Nenhuma loteria selecionada. Marque ao menos uma acima, ou use “Apenas Principais” / “TODAS AS LOTERIAS”.</div>
  <div id="app"></div>
  <div class="note" id="notas"></div>
</div>
<div class="tip" id="tip"></div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const brl = n => n.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const num = (n,d=2) => n.toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d});
const compact = n => {
  const a = Math.abs(n);
  if (a >= 1e9) return "R$ " + (n/1e9).toLocaleString("pt-BR",{maximumFractionDigits:1}) + " bi";
  if (a >= 1e6) return "R$ " + (n/1e6).toLocaleString("pt-BR",{maximumFractionDigits:1}) + " mi";
  if (a >= 1e3) return "R$ " + (n/1e3).toLocaleString("pt-BR",{maximumFractionDigits:0}) + " mil";
  return "R$ " + Math.round(n);
};
const fmtData = iso => iso ? iso.split("-").reverse().join("/") : "";
const pctStr = v => v.toLocaleString("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:1}) + "%";

// ---------- Constantes ----------
const PRINCIPAIS = ["megasena","lotofacil","quina"];
const corLot = slug => `var(--l-${slug}, var(--c6))`;

// Salário mínimo nacional: vigência (AAAA-MM) → valor. Fonte: contabeis.com.br/tabelas/salario-minimo
// (conferir com os decretos/leis de cada ano; o valor de 2026 não foi conferido no decreto).
const SM = [["1994-07",64.79],["1994-09",70],["1995-05",100],["1996-05",112],["1997-05",120],["1998-05",130],
  ["1999-05",136],["2000-04",151],["2001-04",180],["2002-04",200],["2003-04",240],["2004-05",260],["2005-05",300],
  ["2006-04",350],["2007-04",380],["2008-03",415],["2009-02",465],["2010-01",510],["2011-01",540],["2011-03",545],
  ["2012-01",622],["2013-01",678],["2014-01",724],["2015-01",788],["2016-01",880],["2017-01",937],["2018-01",954],
  ["2019-01",998],["2020-01",1039],["2020-02",1045],["2021-01",1100],["2022-01",1212],["2023-01",1302],
  ["2023-05",1320],["2024-01",1412],["2025-01",1518],["2026-01",1621]];
const smEm = ym => { let v = null; for(const [k,x] of SM){ if(k <= ym) v = x; else break; } return v; };
const SM_HOJE = SM[SM.length-1];

// Divisão da arrecadação (% da arrecadação). Padrão: tabela atual da Caixa para a Mega-Sena (prêmios 43,35%; repasses 37,49%; custeio 19,13%).
// Timemania: Lei 11.345/2006, art. 2º, texto original (clubes 22% não é governo nem operação; não verifiquei alterações posteriores).
const SPLIT = { padrao:{ rep:37.49, cust:19.13, clubes:0 }, timemania:{ rep:12, cust:20, clubes:22 } };
const splitDe = slug => SPLIT[slug] || SPLIT.padrao;
const TIP = {
  apost: "Apostadores\nPrêmio bruto informado pela Caixa menos o IRRF: o que as pessoas de fato recebem.",
  ir: "IRRF — Imposto de Renda retido na fonte e recolhido à União\n30% por ganhador, tributação exclusiva. Desde 2008, só sobre o que excede a 1ª faixa da tabela mensal do IRPF (Lei 11.941/2009, art. 56); até 2007, sobre o prêmio inteiro acima de R$ 11,10 (RIR/1999, art. 676).",
  rep: "Repasses sociais (tabela atual da Caixa para a Mega-Sena, % da arrecadação; 37,49% no total):\n• Seguridade Social: 17,32%\n• Segurança Pública (FNSP): 9,26%\n• Cultura (FNC): 2,92%\n• Esporte (Ministério): 2,46%\n• Comitê Olímpico (COB): 1,73%\n• Comitê Paralímpico (CPB): 0,93%\n• Funpen: 1,00%\n• Outras entidades esportivas: 1,00% (CBC, CBDE, CBDU, Fenaclubs)\nO FIES não aparece nessa tabela. Aplicado a todo o histórico como estimativa; antes de 2019 a divisão era outra.",
  cust: "Operação — custeio e manutenção do serviço (Caixa): 19,13% da arrecadação na tabela atual. A Caixa informa ainda 3,11% de comissão às lotéricas; não confirmei se já está dentro desses 19,13%.",
  clubes: "Clubes de futebol (Timemania)\n22% da arrecadação pela Lei 11.345/2006 (texto original): remuneração dos clubes que cedem sua marca.",
  resid: "Diferença sem destino identificado\nArrecadação menos prêmios, repasses e custeio estimados. Os prêmios informados pela Caixa somam ~33% da arrecadação (Mega-Sena, Quina), abaixo dos 43,35% da lei. A diferença é parecida com a parcela do IR, o que sugere que o valor informado já vem líquido do imposto; também podem entrar prêmios acumulados ou não pagos."
};

// Concursos especiais: detectados por regra de data + pico (valor ≥ 2× a mediana dos concursos da loteria no ano).
const ESPECIAIS = {
  megasena:  { sym:"V", nome:"Mega da Virada",          ok:(d)=>d.m===12 && d.d>=28 },
  quina:     { sym:"J", nome:"Quina de São João",       ok:(d)=>d.m===6  && d.d>=20 },
  lotofacil: { sym:"I", nome:"Lotofácil da Independência", ok:(d)=>d.m===9 && d.d<=15 },
  duplasena: { sym:"P", nome:"Dupla Sena de Páscoa",    ok:(d)=>{ const p = pascoa(d.y); const t = Date.UTC(d.y,d.m-1,d.d);
                  const t0 = Date.UTC(p.y,p.m-1,p.d); return t >= t0-3*864e5 && t <= t0+864e5; } }
};
function pascoa(y){ // algoritmo de Meeus/Jones/Butcher
  const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),
    h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),
    mes=Math.floor((h+l-7*m+114)/31),dia=((h+l-7*m+114)%31)+1;
  return {y,m:mes,d:dia};
}

const state = {
  loteriasLista: [], selectedSlugs: [], base: "corrigido", per: "ano", era: "todas", modo: "stack",
  d: null, anoDe: null, anoAte: null,
  cache: {},            // state.cache[slug] = Promise com os dados da loteria (evita fetch repetido)
  basePath: null, tok: 0,
  sim: { valor: 1000000, ano: 2010, mes: 1 }
};

async function getJSON(p){ const r = await fetch(p); if(!r.ok) throw new Error(p); return r.json(); }

// ---------- Tooltip ----------
const tip = $("#tip");
function mostraTip(text, x, y){
  tip.textContent = text; tip.style.display = "block";
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.max(8, Math.min(x + 12, innerWidth - w - 8)) + "px";
  tip.style.top = (y + 12 + h > innerHeight ? Math.max(8, y - h - 12) : y + 12) + "px";
}
function bindTip(el, text){
  el.addEventListener("mousemove", e => mostraTip(text, e.clientX, e.clientY));
  el.addEventListener("mouseleave", () => tip.style.display = "none");
  el.addEventListener("click", e => { e.stopPropagation(); mostraTip(text, e.clientX, e.clientY); });   // toque no celular
}
document.addEventListener("click", () => tip.style.display = "none");
function niceMax(v){ const p = Math.pow(10, Math.floor(Math.log10(v||1))); const m = v/p;
  return (m<=1?1:m<=2?2:m<=5?5:10)*p; }

// ---------- Gráficos ----------
// rows: [{label, valores:[...]}] ; series: [{nome, cor}] ; opt: {modo:"stack"|"group", marcas:{label:[{sym,cor,tip}]}}
function barChart(el, rows, series, opt = {}){
  const modo = opt.modo === "group" ? "group" : "stack", marcas = opt.marcas || {}, fmt = opt.fmt || compact, fmtTip = opt.fmtTip || brl;
  const maxMarks = Math.max(0, ...rows.map(r => (marcas[r.label] || []).length));
  const W=960,H=300,L=64,R=8,T=12+maxMarks*16,B=28, iw=W-L-R, ih=H-T-B;
  const soma = r => r.valores.reduce((a,b)=>a+b,0);
  const topo = r => modo==="group" ? Math.max(0, ...r.valores) : soma(r);
  const max = opt.max || niceMax(Math.max(...rows.map(topo), 1));
  const y = v => T + ih - v/max*ih;
  const bw = iw/(rows.length||1), gap = Math.min(4, bw*.2), n = series.length;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img">`;
  for(let i=0;i<=4;i++){ const v=max/4*i, yy=y(v);
    s += `<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="var(--line)"/>`;
    s += `<text x="${L-6}" y="${yy+4}" text-anchor="end">${fmt(v)}</text>`; }
  const passo = Math.max(1, Math.ceil(rows.length / Math.max(1, Math.floor(iw/46))));
  rows.forEach((r,i)=>{
    const x = L+i*bw+gap/2, w = Math.max(1,bw-gap);
    if(modo === "stack"){
      let acc=0;
      r.valores.forEach((v,k)=>{ if(v<=0) return;
        const y0=y(acc+v), h=y(acc)-y0; acc+=v;
        s += `<rect data-i="${i}" data-k="${k}" x="${x}" y="${y0}" width="${w}" height="${Math.max(h,0)}" fill="${series[k].cor}" rx="1.5"/>`; });
    } else {
      const sw = w/n;
      r.valores.forEach((v,k)=>{ if(v<=0) return;
        const y0=y(v);
        s += `<rect data-i="${i}" data-k="${k}" x="${x+k*sw}" y="${y0}" width="${Math.max(.8,sw-.4)}" height="${Math.max(y(0)-y0,0)}" fill="${series[k].cor}" rx="1"/>`; });
    }
    if(i%passo===0) s += `<text x="${x+w/2}" y="${H-8}" text-anchor="middle">${r.label}</text>`;
    (marcas[r.label] || []).forEach((m,j)=>{
      const cx = x+w/2, cy = Math.max(9, y(topo(r)) - 10 - j*16);
      s += `<g class="mk" data-i="${i}" data-j="${j}"><circle cx="${cx}" cy="${cy}" r="7.5" fill="var(--card)" stroke="${m.cor}" stroke-width="1.8"/>
        <text x="${cx}" y="${cy+3.4}" text-anchor="middle" style="fill:${m.cor};font-size:9px;font-weight:700">${m.sym}</text></g>`;
    });
  });
  s += `</svg>`;
  el.innerHTML = s;
  el.querySelectorAll("rect").forEach(rc => {
    const r = rows[+rc.dataset.i], k = +rc.dataset.k;
    bindTip(rc, `${r.label} · ${series[k].nome}: ${fmtTip(r.valores[k], r, k)}` + (n>1 && !opt.max ? `\nTotal do período: ${fmtTip(soma(r), r, -1)}` : ""));
  });
  el.querySelectorAll(".mk").forEach(g => bindTip(g, marcas[rows[+g.dataset.i].label][+g.dataset.j].tip));
}

// Rosca com o percentual dentro de cada fatia (fatias < 3,5% ficam só na legenda) e tooltip por fatia.
function donutChart(el, items){
  const size=280, cx=140, cy=140, r=100, stroke=52;
  const total = items.reduce((a,b)=>a+b.val,0);
  let ang = -Math.PI / 2, fatias = "", rotulos = "";
  items.forEach((it,i) => {
    const sl = (total > 0 ? it.val / total : 0) * 2 * Math.PI;
    if(sl <= 0) return;
    const a1 = ang, a2 = ang + sl; ang = a2;
    if(sl >= 2*Math.PI - 1e-6){
      fatias += `<circle class="slice" data-i="${i}" cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${it.cor}" stroke-width="${stroke}"/>`;
    } else {
      const x1 = cx + r*Math.cos(a1), y1 = cy + r*Math.sin(a1), x2 = cx + r*Math.cos(a2), y2 = cy + r*Math.sin(a2);
      fatias += `<path class="slice" data-i="${i}" d="M ${x1} ${y1} A ${r} ${r} 0 ${sl > Math.PI ? 1 : 0} 1 ${x2} ${y2}" fill="none" stroke="${it.cor}" stroke-width="${stroke}"/>`;
    }
    const pct = it.val / total * 100;
    if(pct >= 3.5){
      const m = (a1 + a2) / 2;
      rotulos += `<text class="donut-pct" x="${cx + r*Math.cos(m)}" y="${cy + r*Math.sin(m)}" text-anchor="middle" dominant-baseline="central" pointer-events="none">${pctStr(pct)}</text>`;
    }
  });
  el.innerHTML = `<svg viewBox="0 0 ${size} ${size}" role="img" style="max-width:300px">${fatias}${rotulos}
    <text class="donut-total" x="${cx}" y="${cy-6}" text-anchor="middle">${compact(total)}</text>
    <text class="donut-sub" x="${cx}" y="${cy+13}" text-anchor="middle">Total estimado</text></svg>`;
  el.querySelectorAll(".slice").forEach(p => {
    const it = items[+p.dataset.i];
    bindTip(p, `${it.nome} — ${compact(it.val)} (${pctStr(total ? it.val/total*100 : 0)})\n${it.tip || ""}`);
  });
}

// itens: [{nome, cor, tip?}]
function legend(el, itens){

// ---------- Filtros / agregação ----------
const sufixo = () => state.base==="corrigido" ? "_corrigido" : "_nominal";

function filtrarPorAnoEERA(lista){
  if(!Array.isArray(lista)) return [];
  return lista.filter(r => {
    const ano = parseInt(r.ano ?? r.mes ?? r.data);   // resumo por ano, por mês ou concurso (data)
    if(isNaN(ano)) return true;
    if(state.anoDe && ano < state.anoDe) return false;
    if(state.anoAte && ano > state.anoAte) return false;
    if(state.era === "pre" && ano > 2014) return false;
    if(state.era === "pos" && ano < 2015) return false;
    return true;
  });
}
const anoFinal = () => state.d?.ano?.length ? state.d.ano[state.d.ano.length-1].ano : new Date().getFullYear();

// Concursos especiais por loteria (calculado uma vez e guardado no cache da loteria)
function especiaisDe(d){
  if(d.especiais) return d.especiais;
  const regra = ESPECIAIS[d.slug]; d.especiais = [];
  if(!regra) return d.especiais;
  const porAno = {}, cand = {};
  for(const c of d.concursos){
    const [y,m,dd] = c.data.split("-").map(Number), ano = y;
    (porAno[ano] ||= []).push(c);
    if(regra.ok({y,m,d:dd})){ const k = ano; if(!cand[k] || c.bruto_nominal > cand[k].bruto_nominal) cand[k] = c; }
  }
  const mediana = (arr, f) => { const v = arr.map(f).sort((a,b)=>a-b); return v.length ? v[Math.floor(v.length/2)] : 0; };
  for(const [ano,c] of Object.entries(cand)){
    const med = { _corrigido: mediana(porAno[ano], r=>r.bruto_corrigido), _nominal: mediana(porAno[ano], r=>r.bruto_nominal) };
    d.especiais.push({ slug:d.slug, sym:regra.sym, nome:regra.nome, ano:+ano, data:c.data, concurso:c.concurso,
      v:{ _corrigido:c.bruto_corrigido, _nominal:c.bruto_nominal }, med });
  }
  return d.especiais;
}

function montarMarcas(suf, chave){
  const marcas = {};
  for(const d of state.dados){
    for(const e of especiaisDe(d)){
      if(e.v[suf] < 2*e.med[suf] || e.v[suf] <= 0) continue;           // critério de pico
      const label = chave === "ano" ? String(e.ano) : e.data.slice(0,7);
      (marcas[label] ||= []).push({ sym:e.sym, cor:corLot(d.slug),
        tip:`${e.nome} ${e.ano}\nConcurso ${e.concurso} · ${fmtData(e.data)}\nBruto pago: ${brl(e.v[suf])} (${state.base})` });
    }
  }
  return marcas;
}

function badge(slug, nome){ return `<span class="badge" style="--lc:${corLot(slug)}">${nome}</span>`; }

// ---------- Modelo: quem fica com cada real arrecadado ----------
const SERIES_G = [
  { k:"apost",  nome:"Apostadores (prêmio líquido)", cor:"var(--c1)", tip:TIP.apost },
  { k:"ir",     nome:"IRRF (União)",                  cor:"var(--c2)", tip:TIP.ir },
  { k:"rep",    nome:"Repasses sociais",              cor:"var(--c3)", tip:TIP.rep },
  { k:"cust",   nome:"Operação (custeio da Caixa)",   cor:"var(--c5)", tip:TIP.cust },
  { k:"clubes", nome:"Clubes (Timemania)",            cor:"var(--c4)", tip:TIP.clubes },
  { k:"resid",  nome:"Diferença sem destino identificado", cor:"var(--c6)", tip:TIP.resid }
];
const G0 = () => ({ A:0, real:0, bruto:0, ir:0, apost:0, rep:0, cust:0, clubes:0, resid:0 });
function somaG(a, b){ for(const k in a) a[k] += b[k]; return a; }

// l: dados da loteria; r: linha de resumo (ano ou mês). A = arrecadação real da Caixa; onde falta, estimada pelo
// prêmio ÷ razão prêmio/arrecadação observada nessa loteria. A base corrigida usa o fator Selic médio da linha.
function grupos(l, r, suf){
  const sp = splitDe(l.slug), nomB = r.bruto_nominal || 0, arr = r.arrecadado || 0;
  const Anom = arr + Math.max(0, nomB - (r.bruto_com_arrec || 0)) / l.ratio;
  const fator = nomB > 0 ? (r.bruto_corrigido || 0) / nomB : 1;
  const A = suf === "_corrigido" ? Anom * fator : Anom;
  const bruto = r["bruto"+suf] || 0, ir = r["ir"+suf] || 0;
  const rep = A*sp.rep/100, cust = A*sp.cust/100, clubes = A*sp.clubes/100;
  return { A, real: suf === "_corrigido" ? arr*fator : arr, bruto, ir, apost: Math.max(0, bruto-ir), rep, cust, clubes,
           resid: Math.max(0, A - (bruto + rep + cust + clubes)) };
}
const pctDe = (v, A) => A > 0 ? v/A*100 : 0;

// ---------- Simulador: poder de compra em salários mínimos ----------
function fatorSelic(ym){
  // fator médio do mês (corrigido ÷ nominal, ponderado pelos prêmios das loterias selecionadas); sem concurso no mês, usa o ano
  const tot = (lista, chave, val) => { let n=0, c=0;
    for(const x of state.dados){ const r = lista(x).find(r => String(r[chave]) === val); if(r){ n += r.bruto_nominal||0; c += r.bruto_corrigido||0; } }
    return n > 0 ? c/n : null; };
  const m = tot(x => x.mes, "mes", ym);
  if(m) return { f:m, de:"do mês" };
  const a = tot(x => x.ano, "ano", ym.slice(0,4));
  return a ? { f:a, de:"do ano (não houve concursos no mês)" } : null;
}
function renderSim(){
  const out = $("#sim-out"); if(!out) return;
  const {valor, ano, mes} = state.sim, ym = `${ano}-${String(mes).padStart(2,"0")}`;
  const sm0 = smEm(ym), fs = fatorSelic(ym);
  if(!(valor > 0) || !(ano >= 1994) || sm0 == null){
    out.innerHTML = `<div class="cell"><div class="l">Atenção</div><div class="d">Informe um valor positivo e uma data a partir de 07/1994 (início do Real).</div></div>`; return; }
  if(!fs){ out.innerHTML = `<div class="cell"><div class="l">Sem dados</div><div class="d">Não há concursos das loterias selecionadas em ${String(mes).padStart(2,"0")}/${ano}, nem no ano, para estimar o fator da Selic.</div></div>`; return; }
  const corrigido = valor*fs.f, smHoje = SM_HOJE[1], nSM = valor/sm0, mantido = nSM*smHoje;
  const reajusteSM = smHoje/sm0, dif = (fs.f/reajusteSM - 1)*100;
  const cel = (l,v,dd) => `<div class="cell"><div class="l">${l}</div><div class="v">${v}</div><div class="d">${dd}</div></div>`;
  out.innerHTML =
    cel("Valor corrigido pela Selic até hoje", brl(corrigido), `fator ×${num(fs.f,3)} (média ${fs.de})`) +
    cel(`Salário mínimo em ${String(mes).padStart(2,"0")}/${ano}`, brl(sm0), `o valor equivalia a ${num(nSM,1)} salários mínimos`) +
    cel(`Salário mínimo hoje (${SM_HOJE[0].split("-").reverse().join("/")})`, brl(smHoje), `o valor corrigido pela Selic compra ${num(corrigido/smHoje,1)} salários mínimos de hoje`) +
    cel("Mesmo poder de compra em salários mínimos", brl(mantido), `${num(nSM,1)} SM × ${brl(smHoje)}`) +
    cel("Selic × salário mínimo", `${dif>=0?"+":""}${num(dif,1)}%`, `Selic ×${num(fs.f,2)} contra reajuste do mínimo ×${num(reajusteSM,2)}: a Selic ${dif>=0?"superou":"ficou abaixo do"} reajuste do mínimo${dif>=0?"":""} no período`.replace("superou reajuste","superou o reajuste"));
}

        <div class="sim-in">
          <label>Valor do prêmio (R$, na época)<input type="number" id="simValor" min="1" step="1000" value="${state.sim.valor}"></label>
          <label>Mês<select id="simMes">${["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"].map((m,i)=>`<option value="${i+1}" ${i+1===state.sim.mes?"selected":""}>${m}</option>`).join("")}</select></label>
          <label>Ano<input type="number" id="simAno" min="1994" max="2100" value="${state.sim.ano}"></label>
        </div>
        <div class="sim-out" id="sim-out"></div>
        <p class="note">Corrige pela Selic (só Selic, sem IPCA) com o fator médio dos concursos do mês das loterias selecionadas, ponderado pelos prêmios; é uma aproximação, não a data exata de um sorteio. Salário mínimo nacional vigente no mês, conforme tabela de <a href="https://www.contabeis.com.br/tabelas/salario-minimo/" target="_blank" rel="noopener">contabeis.com.br</a> (o valor de 2026 não foi conferido no decreto).</p>
      </div>

      <div class="card"><h2>Resumo por Período</h2><div class="scroll"><table><thead id="tp-h"></thead><tbody id="tp-b"></tbody></table></div></div>
      <div class="card"><h2>Concursos <span class="sub">(últimos 200 / busca por nº, data ou loteria)</span></h2>
        <p style="margin:0 0 8px"><input type="search" id="busca" placeholder="Buscar concurso, data ou loteria…"></p>
        <div class="scroll"><table><thead><tr><th>Loteria</th><th>Concurso</th><th>Data</th><th>Bruto Pago</th><th>IR Arrecadado</th></tr></thead><tbody id="tc-b"></tbody></table></div></div>
    </div>`;

  for(const [id,key] of [["#sBase","base"],["#sPer","per"],["#sEra","era"],["#sModo","modo"]]){
    $(id).addEventListener("click", e => { const b = e.target.closest("button"); if(!b) return;
      state[key] = b.dataset.v; $(id).querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed", x===b)); render(); });
  }
  $("#busca").addEventListener("input", renderConcursos);
  $("#simValor").addEventListener("input", e => { state.sim.valor = parseFloat(e.target.value); renderSim(); });
  $("#simMes").addEventListener("change", e => { state.sim.mes = +e.target.value; renderSim(); });
  $("#simAno").addEventListener("input", e => { state.sim.ano = parseInt(e.target.value); renderSim(); });
}

// ---------- Carga (com cache por loteria) ----------
function carregarLoteria(slug){
  if(state.cache[slug]) return state.cache[slug];
  const p = (async () => {
    const bases = state.basePath ? [state.basePath] : ["data/","docs/data/","./data/"];
    for(const b of bases){
      try{
        const [meta, ano, mes, concursos] = await Promise.all(
          ["meta","resumo_ano","resumo_mes","concursos"].map(n => getJSON(`${b}${slug}/${n}.json`)));
        state.basePath = b;
        // razão prêmio ÷ arrecadação nos concursos em que a Caixa informa a arrecadação (usada para estimar os demais)
        const sa = (ano||[]).reduce((s,r) => s + (r.arrecadado||0), 0), sb = (ano||[]).reduce((s,r) => s + (r.bruto_com_arrec||0), 0);
        return { slug, meta, ano: ano||[], mes: mes||[], concursos: concursos||[], ratio: sa > 0 && sb > 0 ? sb/sa : 0.33 };
      }catch(e){}
    }
    throw new Error("sem dados: " + slug);
  })();
  state.cache[slug] = p;
  p.catch(() => { delete state.cache[slug]; });     // falha não fica em cache: nova tentativa no próximo clique
  return p;
}

const SOMAS = ["concursos","bruto_corrigido","bruto_nominal","ir_corrigido","ir_nominal","arrecadado","bruto_com_arrec"];
function agrega(dados, campo, chave){
  const mapa = {};
  for(const d of dados) for(const r of d[campo]){
    const m = mapa[r[chave]] ||= Object.fromEntries([[chave, r[chave]], ...SOMAS.map(k => [k,0])]);
    for(const k of SOMAS) m[k] += r[k] || 0;
  }
  return Object.values(mapa);
}

async function carregarSelecionadas(){
  const tok = ++state.tok;
  if(!state.selectedSlugs.length){
    state.d = null; state.dados = [];
    $("#app").hidden = true; $("#vazio").hidden = false; $("#banner").innerHTML = ""; $("#atualizado").textContent = "";
    return;
  }
  const res = await Promise.allSettled(state.selectedSlugs.map(carregarLoteria));
  if(tok !== state.tok) return;                       // houve outro clique enquanto carregava
  const dados = res.filter(r => r.status === "fulfilled").map(r => r.value);
  if(!dados.length){
    $("#app").hidden = true; $("#vazio").hidden = false;
    $("#vazio").textContent = "Não foi possível carregar os dados das loterias selecionadas.";
    return;
  }
  $("#app").hidden = false; $("#vazio").hidden = true;
  state.dados = dados;
  state.d = {
    meta: dados[0].meta,
    ano: agrega(dados, "ano", "ano").sort((a,b)=>a.ano-b.ano),
    mes: agrega(dados, "mes", "mes").sort((a,b)=>a.mes.localeCompare(b.mes)),
    concursos: dados.flatMap(d => d.concursos.map(c => ({...c, slug:d.slug, loteria:d.meta.nome})))
      .sort((a,b)=> a.data < b.data ? -1 : a.data > b.data ? 1 : a.concurso - b.concurso),
    porLoteria: dados.map(d => ({slug:d.slug, nome:d.meta.nome, ano:d.ano}))
  };

  const maisRecente = dados.map(d => d.meta.atualizado_em).sort().pop();
  $("#atualizado").textContent = `Atualizado em ${new Date(maisRecente).toLocaleString("pt-BR")} · Selic até ${fmtData(dados[0].meta.selic_ate)}`;

  const avisos = dados.flatMap(d => (d.meta.regras_ir_pendentes || []).map(p =>
    `${d.meta.nome}: ${fmtData(p.de)}${p.ate ? " a " + fmtData(p.ate) : " em diante"}`));
  $("#banner").innerHTML = avisos.length
    ? `<div class="banner"><b>Atenção:</b> o limite de isenção do IR ainda não foi conferido com a legislação em: ${avisos.join("; ")}. O IR desses períodos é provisório.</div>` : "";
  render();
}

// ---------- Seleção de loterias e períodos ----------
function sincronizaChecks(){
  document.querySelectorAll(".chkLot").forEach(c => c.checked = state.selectedSlugs.includes(c.dataset.slug));
  const todas = state.loteriasLista.map(l => l.slug);
  const principais = PRINCIPAIS.filter(s => todas.includes(s));
  const igual = (a,b) => a.length === b.length && a.every(x => b.includes(x));
  $("#btnTodas").setAttribute("aria-pressed", igual(state.selectedSlugs, todas));
  $("#btnPrincipais").setAttribute("aria-pressed", principais.length > 0 && igual(state.selectedSlugs, principais));
  $("#btnLimpar").setAttribute("aria-pressed", state.selectedSlugs.length === 0);
}
function selecionar(slugs){
  state.selectedSlugs = slugs; sincronizaChecks(); carregarSelecionadas();
}
function renderCheckboxes(){
  $("#lotteryCheckboxes").innerHTML = state.loteriasLista.map(l => `
    <label class="checkbox-item"><input type="checkbox" class="chkLot" data-slug="${l.slug}">
      <span class="dot" style="background:${corLot(l.slug)}"></span>${l.nome}</label>`).join("");
  document.querySelectorAll(".chkLot").forEach(chk => chk.addEventListener("change", () =>
    selecionar(state.loteriasLista.map(l => l.slug).filter(s => document.querySelector(`.chkLot[data-slug="${s}"]`).checked))));
  $("#btnTodas").addEventListener("click", () => selecionar(state.loteriasLista.map(l => l.slug)));
  $("#btnPrincipais").addEventListener("click", () => selecionar(PRINCIPAIS.filter(s => state.loteriasLista.some(l => l.slug === s))));
  $("#btnLimpar").addEventListener("click", () => selecionar([]));
}

function definePeriodo(de, ate){
  state.anoDe = de; state.anoAte = ate;
  $("#anoDe").value = de ?? ""; $("#anoAte").value = ate ?? "";
  render();
}
function marcarPresets(){
  const fim = anoFinal(), {anoDe:de, anoAte:ate} = state;
  document.querySelectorAll("#presets .btn").forEach(b => {
    const p = b.dataset.p;
    b.setAttribute("aria-pressed", p === "todo" ? (de == null && ate == null) : (ate === fim && de === fim - (+p) + 1));
  });
}

(async function init(){
  let lista = [];
  for(const p of ["data/loterias.json", "docs/data/loterias.json", "./data/loterias.json"]){
    try{ lista = await getJSON(p); if(lista.length) break; }catch(e){}
  }
  if(!lista.length){ $("#app").innerHTML = `<div class="card empty">Carregando dados das loterias…</div>`; return; }

  state.loteriasLista = lista;
  esqueleto();
  renderCheckboxes();

  $("#anoDe").addEventListener("input", e => { state.anoDe = e.target.value ? parseInt(e.target.value) : null; render(); });
  $("#anoAte").addEventListener("input", e => { state.anoAte = e.target.value ? parseInt(e.target.value) : null; render(); });
  $("#presets").addEventListener("click", e => {
    const b = e.target.closest("button"); if(!b) return;
    const fim = anoFinal();
    b.dataset.p === "todo" ? definePeriodo(null, null) : definePeriodo(fim - (+b.dataset.p) + 1, fim);
  });

  selecionar(lista.map(l => l.slug));       // padrão: todas
})();
</script>

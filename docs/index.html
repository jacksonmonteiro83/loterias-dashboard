<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Histórico das Loterias</title>
<style>
:root{
  --bg:#f6f5f1; --card:#ffffff; --ink:#1c1b19; --muted:#6b675f; --line:#e3e0d8;
  --accent:#1f6f4a; --accent-2:#b4540a; --warn-bg:#fff4d6; --warn-ink:#6b4a00;
  --c1:#1f6f4a; --c2:#c9822b; --c3:#3a6ea5; --c4:#8a4f9e; --c5:#b0453a; --c6:#5c6b73;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14130f; --card:#1d1c17; --ink:#ece9e0; --muted:#a29d90; --line:#34312a;
    --accent:#4fb283; --accent-2:#e39a4e; --warn-bg:#3a2f10; --warn-ink:#f1d78a;
    --c1:#4fb283; --c2:#e0a04a; --c3:#6fa3da; --c4:#b88ad0; --c5:#e17a6d; --c6:#93a3ab;
  }
}
:root[data-theme="dark"]{
  --bg:#14130f; --card:#1d1c17; --ink:#ece9e0; --muted:#a29d90; --line:#34312a;
  --accent:#4fb283; --accent-2:#e39a4e; --warn-bg:#3a2f10; --warn-ink:#f1d78a;
  --c1:#4fb283; --c2:#e0a04a; --c3:#6fa3da; --c4:#b88ad0; --c5:#e17a6d; --c6:#93a3ab;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:24px 16px 64px}
header{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between;margin-bottom:16px}
h1{font-size:24px;margin:0;letter-spacing:-.01em}
h2{font-size:16px;margin:0 0 12px}
.sub{color:var(--muted);font-size:13px}
.banner{background:var(--warn-bg);color:var(--warn-ink);border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:14px}
.tabs,.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.tabs button,.seg button{border:0;background:transparent;color:var(--ink);padding:7px 14px;font:inherit;cursor:pointer}
.tabs button[aria-pressed="true"],.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.controls{display:flex;flex-wrap:wrap;gap:12px;margin:12px 0 16px;align-items:center}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.kpi .v{font-size:24px;font-weight:650;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.kpi .l{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.card{min-width:0}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--muted);font-size:11px;font-family:inherit}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
th,td{padding:7px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:600;font-size:12px;position:sticky;top:0;background:var(--card)}
.scroll{overflow:auto;max-height:420px}
input[type=search]{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;min-width:200px}
a{color:var(--accent)}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);padding:5px 9px;border-radius:6px;font-size:12px;display:none;z-index:10;white-space:nowrap}
.note{color:var(--muted);font-size:12px;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Histórico das Loterias</h1>
    <div class="sub" id="atualizado"></div>
  </header>
  <div id="tabs" class="tabs" role="group" aria-label="Loteria"></div>
  <div id="banner"></div>
  <div id="app"></div>
  <div class="note" id="notas"></div>
</div>
<div class="tip" id="tip"></div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const brl = n => n.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const compact = n => {
  const a = Math.abs(n);
  if (a >= 1e9) return "R$ " + (n/1e9).toLocaleString("pt-BR",{maximumFractionDigits:1}) + " bi";
  if (a >= 1e6) return "R$ " + (n/1e6).toLocaleString("pt-BR",{maximumFractionDigits:1}) + " mi";
  if (a >= 1e3) return "R$ " + (n/1e3).toLocaleString("pt-BR",{maximumFractionDigits:0}) + " mil";
  return "R$ " + Math.round(n);
};
const fmtData = iso => iso.split("-").reverse().join("/");
const state = { slug:null, base:"corrigido", per:"ano", d:null };

async function getJSON(p){ const r = await fetch(p); if(!r.ok) throw new Error(p); return r.json(); }

/* ---------- gráficos SVG ---------- */
const tip = $("#tip");
function bindTip(el, text){
  el.addEventListener("mousemove", e => { tip.textContent = text; tip.style.display="block";
    tip.style.left = (e.clientX+12)+"px"; tip.style.top = (e.clientY+12)+"px"; });
  el.addEventListener("mouseleave", () => tip.style.display="none");
}
function niceMax(v){ const p = Math.pow(10, Math.floor(Math.log10(v||1))); const m = v/p;
  return (m<=1?1:m<=2?2:m<=5?5:10)*p; }

/* series: [{nome, cor}], rows: [{label, valores:[...]}] -> barras empilhadas */
function barChart(el, rows, series){
  const W=960,H=300,L=64,R=8,T=10,B=28, iw=W-L-R, ih=H-T-B;
  const totais = rows.map(r => r.valores.reduce((a,b)=>a+b,0));
  const max = niceMax(Math.max(...totais, 1));
  const y = v => T + ih - v/max*ih;
  const bw = iw/rows.length, gap = Math.min(4, bw*.2);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img">`;
  for(let i=0;i<=4;i++){ const v=max/4*i, yy=y(v);
    s += `<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="var(--line)"/>`;
    s += `<text x="${L-6}" y="${yy+4}" text-anchor="end">${compact(v)}</text>`; }
  const passo = Math.ceil(rows.length/ Math.floor(iw/46));
  rows.forEach((r,i)=>{
    let acc=0; const x = L+i*bw+gap/2, w = Math.max(1,bw-gap);
    r.valores.forEach((v,k)=>{ if(v<=0) return;
      const y0=y(acc+v), h=y(acc)-y0; acc+=v;
      s += `<rect data-i="${i}" data-k="${k}" x="${x}" y="${y0}" width="${w}" height="${Math.max(h,0)}" fill="${series[k].cor}" rx="1.5"/>`; });
    if(i%passo===0) s += `<text x="${x+w/2}" y="${H-8}" text-anchor="middle">${r.label}</text>`;
  });
  s += `</svg>`;
  el.innerHTML = s;
  el.querySelectorAll("rect").forEach(rc => {
    const r = rows[+rc.dataset.i], k = +rc.dataset.k;
    bindTip(rc, `${r.label} · ${series[k].nome}: ${brl(r.valores[k])}` + (series.length>1 ? ` (total ${brl(r.valores.reduce((a,b)=>a+b,0))})`:""));
  });
}
function legend(el, series){
  el.innerHTML = series.length>1 ? series.map(s=>`<span><i style="background:${s.cor}"></i>${s.nome}</span>`).join("") : "";
}

/* ---------- renderização ---------- */
function sufixo(){ return state.base==="corrigido" ? "_corrigido" : "_nominal"; }
function render(){
  const d = state.d, suf = sufixo();
  const resumo = state.per==="ano" ? d.ano : d.mes;
  const chave = state.per==="ano" ? "ano" : "mes";
  const t = d.meta.totais;
  const bruto = t["bruto"+suf], ir = t["ir"+suf];
  const rotulo = state.base==="corrigido" ? "corrigido pela Selic" : "nominal";
  $("#kpis").innerHTML = [
    ["Prêmios brutos pagos", compact(bruto), brl(bruto)+" · "+rotulo],
    ["IR arrecadado", compact(ir), brl(ir)+" · "+rotulo],
    ["Alíquota efetiva", (bruto? ir/bruto*100:0).toLocaleString("pt-BR",{maximumFractionDigits:1})+"%", "IR ÷ bruto"],
    ["Concursos", d.meta.concursos.toLocaleString("pt-BR"), "até o nº "+d.meta.ultimo_concurso+" ("+fmtData(d.meta.data_ultimo_concurso)+")"],
  ].map(([l,v,s])=>`<div class="card kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="l">${s}</div></div>`).join("");

  // gráfico 1: IR por período
  $("#t1").textContent = `IR arrecadado por ${state.per==="ano"?"ano":"mês"} (${rotulo})`;
  barChart($("#c1"), resumo.map(r=>({label:r[chave], valores:[r["ir"+suf]]})), [{nome:"IR arrecadado", cor:"var(--accent-2)"}]);

  // gráfico 2: bruto por faixa, por ano (ou mês -> total)
  $("#t2").textContent = `Prêmios brutos pagos por ${state.per==="ano"?"ano e faixa":"mês"} (${rotulo})`;
  if(state.per==="ano"){
    const faixas = [...new Map(d.faixa.map(f=>[f.faixa,f.descricao])).entries()].sort((a,b)=>a[0]-b[0]);
    const series = faixas.map(([n,desc],i)=>({nome:desc, cor:`var(--c${(i%6)+1})`}));
    const rows = resumo.map(r=>({label:r.ano, valores:faixas.map(([n])=>{
      const f = d.faixa.find(x=>x.ano===r.ano && x.faixa===n); return f? f["bruto"+suf]:0; })}));
    barChart($("#c2"), rows, series); legend($("#l2"), series);
  } else {
    barChart($("#c2"), resumo.map(r=>({label:r.mes, valores:[r["bruto"+suf]]})), [{nome:"Bruto pago", cor:"var(--c1)"}]);
    legend($("#l2"), []);
  }

  // tabela de períodos
  $("#tp-h").innerHTML = `<tr><th>${state.per==="ano"?"Ano":"Mês"}</th><th>Concursos</th><th>Bruto pago</th><th>IR arrecadado</th><th>Alíq.</th></tr>`;
  $("#tp-b").innerHTML = [...resumo].reverse().map(r=>{
    const b=r["bruto"+suf], i=r["ir"+suf];
    return `<tr><td>${r[chave]}</td><td>${r.concursos}</td><td>${brl(b)}</td><td>${brl(i)}</td><td>${b?(i/b*100).toFixed(1):"0.0"}%</td></tr>`; }).join("");
  renderConcursos();
}
function renderConcursos(){
  const suf = sufixo(), q = ($("#busca")?.value||"").trim();
  let rows = state.d.concursos;
  if(q) rows = rows.filter(r => String(r.concurso).includes(q) || fmtData(r.data).includes(q));
  rows = [...rows].reverse().slice(0,200);
  $("#tc-b").innerHTML = rows.map(r=>`<tr><td>${r.concurso}</td><td>${fmtData(r.data)}</td><td>${brl(r["bruto"+suf])}</td><td>${brl(r["ir"+suf])}</td></tr>`).join("")
    || `<tr><td colspan="4" class="empty">Nenhum concurso encontrado</td></tr>`;
}

function esqueleto(){
  $("#app").innerHTML = `
    <div class="controls">
      <div class="seg" id="sBase"><button data-v="corrigido" aria-pressed="true">Corrigido (Selic)</button><button data-v="nominal" aria-pressed="false">Nominal</button></div>
      <div class="seg" id="sPer"><button data-v="ano" aria-pressed="true">Por ano</button><button data-v="mes" aria-pressed="false">Por mês</button></div>
    </div>
    <div class="kpis" id="kpis"></div>
    <div class="grid">
      <div class="card"><h2 id="t1"></h2><div id="c1"></div></div>
      <div class="card"><h2 id="t2"></h2><div id="c2"></div><div class="legend" id="l2"></div></div>
      <div class="card"><h2>Resumo por período</h2><div class="scroll"><table><thead id="tp-h"></thead><tbody id="tp-b"></tbody></table></div></div>
      <div class="card"><h2>Concursos <span class="sub">(últimos 200 / busca por nº ou data)</span></h2>
        <p style="margin:0 0 8px"><input type="search" id="busca" placeholder="Buscar concurso ou data…"></p>
        <div class="scroll"><table><thead><tr><th>Concurso</th><th>Data</th><th>Bruto pago</th><th>IR arrecadado</th></tr></thead><tbody id="tc-b"></tbody></table></div></div>
      <div class="card"><h2>Downloads</h2>
        <a id="dl" href="#">faixas.csv</a> — uma linha por concurso e faixa de acerto, com fator Selic, bruto e IR (nominal e corrigido).</div>
    </div>`;
  for(const [id,key] of [["#sBase","base"],["#sPer","per"]]){
    $(id).addEventListener("click", e => { const b = e.target.closest("button"); if(!b) return;
      state[key] = b.dataset.v; $(id).querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed", x===b)); render(); });
  }
  $("#busca").addEventListener("input", renderConcursos);
}

async function carregar(slug){
  state.slug = slug;
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.s===slug));
  const base = `data/${slug}/`;
  try{
    const [meta, ano, mes, faixa, concursos] = await Promise.all(
      ["meta","resumo_ano","resumo_mes","resumo_ano_faixa","concursos"].map(n=>getJSON(base+n+".json")));
    state.d = {meta, ano, mes, faixa, concursos};
  }catch(e){
    $("#app").innerHTML = `<div class="card empty">Ainda não há dados para esta loteria.<br>Rode o workflow “Atualizar loterias” no GitHub (Actions → Run workflow).</div>`;
    $("#banner").innerHTML=""; $("#atualizado").textContent=""; return;
  }
  const m = state.d.meta;
  $("#atualizado").textContent = `Atualizado em ${new Date(m.atualizado_em).toLocaleString("pt-BR")} · Selic até ${fmtData(m.selic_ate)}`;
  $("#banner").innerHTML = m.regras_ir_conferidas ? "" :
    `<div class="banner"><b>Atenção:</b> as regras de IR (limite de isenção por período) ainda não foram conferidas com a legislação. Os valores de IR são provisórios.</div>`;
  esqueleto(); $("#dl").href = base+"faixas.csv"; render();
}

(async function init(){
  let lista=[]; try{ lista = await getJSON("data/loterias.json"); }catch(e){}
  if(!lista.length){ $("#app").innerHTML = `<div class="card empty">Ainda não há dados.<br>Rode o workflow “Atualizar loterias” no GitHub (Actions → Run workflow).</div>`; return; }
  $("#tabs").innerHTML = lista.map(l=>`<button data-s="${l.slug}" aria-pressed="false">${l.nome}</button>`).join("");
  $("#tabs").addEventListener("click", e=>{ const b=e.target.closest("button"); if(b) carregar(b.dataset.s); });
  if(lista.length<2) $("#tabs").style.display="none";
  carregar(lista[0].slug);
})();
</script>
</body>
</html>

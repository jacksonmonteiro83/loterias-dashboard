<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Histórico das Loterias</title>
<style>
:root{
  --bg:#f6f5f1; --card:#ffffff; --ink:#1c1b19; --muted:#6b675f; --line:#e3e0d8;
  --accent:#1f6f4a; --accent-2:#b4540a; --warn-bg:#fff4d6; --warn-ink:#6b4a00;
  --c1:#1f6f4a; --c2:#c9822b; --c3:#3a6ea5; --c4:#8a4f9e; --c5:#b0453a; --c6:#5c6b73;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14130f; --card:#1d1c17; --ink:#ece9e0; --muted:#a29d90; --line:#34312a;
    --accent:#4fb283; --accent-2:#e39a4e; --warn-bg:#3a2f10; --warn-ink:#f1d78a;
    --c1:#4fb283; --c2:#e0a04a; --c3:#6fa3da; --c4:#b88ad0; --c5:#e17a6d; --c6:#93a3ab;
  }
}
:root[data-theme="dark"]{
  --bg:#14130f; --card:#1d1c17; --ink:#ece9e0; --muted:#a29d90; --line:#34312a;
  --accent:#4fb283; --accent-2:#e39a4e; --warn-bg:#3a2f10; --warn-ink:#f1d78a;
  --c1:#4fb283; --c2:#e0a04a; --c3:#6fa3da; --c4:#b88ad0; --c5:#e17a6d; --c6:#93a3ab;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:24px 16px 64px}
header{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between;margin-bottom:16px}
h1{font-size:24px;margin:0;letter-spacing:-.01em}
h2{font-size:16px;margin:0 0 12px}
.sub{color:var(--muted);font-size:13px}
.banner{background:var(--warn-bg);color:var(--warn-ink);border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:14px}
.tabs,.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.tabs button,.seg button{border:0;background:transparent;color:var(--ink);padding:7px 14px;font:inherit;cursor:pointer}
.tabs button[aria-pressed="true"],.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.controls{display:flex;flex-wrap:wrap;gap:12px;margin:12px 0 16px;align-items:center}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.kpi .v{font-size:22px;font-weight:650;letter-spacing:-.01em;font-variant-numeric:tabular-nums;color:var(--accent)}
.kpi .v-sub{font-size:13px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .l{color:var(--muted);font-size:13px;font-weight:600}
.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media (min-width: 768px){
  .grid-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--muted);font-size:11px;font-family:inherit}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
th,td{padding:7px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:600;font-size:12px;position:sticky;top:0;background:var(--card)}
.scroll{overflow:auto;max-height:420px}
input[type=search], input[type=number], select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
input[type=search]{min-width:200px}
a{color:var(--accent)}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);padding:5px 9px;border-radius:6px;font-size:12px;display:none;z-index:10;white-space:nowrap}
.note{color:var(--muted);font-size:12px;margin-top:10px}
.sim-box{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:12px}
.sim-res{font-size:18px;font-weight:600;color:var(--accent);margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Histórico das Loterias</h1>
    <div class="sub" id="atualizado"></div>
  </header>
  <div id="tabs" class="tabs" role="group" aria-label="Loteria"></div>
  <div id="banner"></div>
  <div id="app"></div>
  <div class="note" id="notas"></div>
</div>
<div class="tip" id="tip"></div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const brl = n => n.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const compact = n => {
  const a = Math.abs(n);
  if (a >= 1e9) return "R$ " + (n/1e9).toLocaleString("pt-BR",{maximumFractionDigits:1}) + " bi";
  if (a >= 1e6) return "R$ " + (n/1e6).toLocaleString("pt-BR",{maximumFractionDigits:1}) + " mi";
  if (a >= 1e3) return "R$ " + (n/1e3).toLocaleString("pt-BR",{maximumFractionDigits:0}) + " mil";
  return "R$ " + Math.round(n);
};
const fmtData = iso => iso ? iso.split("-").reverse().join("/") : "";
const state = { slug:null, base:"corrigido", per:"ano", era:"todas", d:null };

async function getJSON(p){ const r = await fetch(p); if(!r.ok) throw new Error(p); return r.json(); }

/* ---------- gráficos SVG ---------- */
const tip = $("#tip");
function bindTip(el, text){
  el.addEventListener("mousemove", e => { tip.textContent = text; tip.style.display="block";
    tip.style.left = (e.clientX+12)+"px"; tip.style.top = (e.clientY+12)+"px"; });
  el.addEventListener("mouseleave", () => tip.style.display="none");
}
function niceMax(v){ const p = Math.pow(10, Math.floor(Math.log10(v||1))); const m = v/p;
  return (m<=1?1:m<=2?2:m<=5?5:10)*p; }

/* Gráfico de Barras Empilhadas */
function barChart(el, rows, series){
  const W=960,H=300,L=64,R=8,T=10,B=28, iw=W-L-R, ih=H-T-B;
  const totais = rows.map(r => r.valores.reduce((a,b)=>a+b,0));
  const max = niceMax(Math.max(...totais, 1));
  const y = v => T + ih - v/max*ih;
  const bw = iw/(rows.length||1), gap = Math.min(4, bw*.2);
  let s = `<svg viewBox="0 0 ${W}${H}" role="img">`;
  for(let i=0;i<=4;i++){ const v=max/4*i, yy=y(v);
    s += `<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="var(--line)"/>`;
    s += `<text x="${L-6}" y="${yy+4}" text-anchor="end">${compact(v)}</text>`; }
  const passo = Math.ceil(rows.length/ Math.floor(iw/46));
  rows.forEach((r,i)=>{
    let acc=0; const x = L+i*bw+gap/2, w = Math.max(1,bw-gap);
    r.valores.forEach((v,k)=>{ if(v<=0) return;
      const y0=y(acc+v), h=y(acc)-y0; acc+=v;
      s += `<rect data-i="${i}" data-k="${k}" x="${x}" y="${y0}" width="${w}" height="${Math.max(h,0)}" fill="${series[k].cor}" rx="1.5"/>

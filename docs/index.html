<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Histórico das Loterias CAIXA</title>
<style>
:root{
  --bg:#f6f5f1; --card:#ffffff; --ink:#1c1b19; --muted:#6b675f; --line:#e3e0d8;
  --accent:#1f6f4a; --accent-2:#b4540a; --warn-bg:#fff4d6; --warn-ink:#6b4a00;
  --c1:#1f6f4a; --c2:#c9822b; --c3:#3a6ea5; --c4:#8a4f9e; --c5:#b0453a; --c6:#5c6b73;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14130f; --card:#1d1c17; --ink:#ece9e0; --muted:#a29d90; --line:#34312a;
    --accent:#4fb283; --accent-2:#e39a4e; --warn-bg:#3a2f10; --warn-ink:#f1d78a;
    --c1:#4fb283; --c2:#e0a04a; --c3:#6fa3da; --c4:#b88ad0; --c5:#e17a6d; --c6:#93a3ab;
  }
}
:root[data-theme="dark"]{
  --bg:#14130f; --card:#1d1c17; --ink:#ece9e0; --muted:#a29d90; --line:#34312a;
  --accent:#4fb283; --accent-2:#e39a4e; --warn-bg:#3a2f10; --warn-ink:#f1d78a;
  --c1:#4fb283; --c2:#e0a04a; --c3:#6fa3da; --c4:#b88ad0; --c5:#e17a6d; --c6:#93a3ab;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:1150px;margin:0 auto;padding:24px 16px 64px}
header{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between;margin-bottom:16px}
h1{font-size:24px;margin:0;letter-spacing:-.01em}
h2{font-size:16px;margin:0 0 12px}
.sub{color:var(--muted);font-size:13px}
.banner{background:var(--warn-bg);color:var(--warn-ink);border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}

/* Painel de Filtros Avançados */
.filter-panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
.filter-title{font-size:14px;font-weight:600;margin-bottom:10px;color:var(--ink)}
.checkbox-group{display:flex;flex-wrap:wrap;gap:10px 16px;margin-bottom:14px}
.checkbox-item{display:inline-flex;align-items:center;gap:6px;font-size:14px;cursor:pointer;user-select:none}
.checkbox-item input[type="checkbox"]{accent-color:var(--accent);width:16px;height:16px;cursor:pointer}
.year-filter{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding-top:10px;border-top:1px dashed var(--line)}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:transparent;color:var(--ink);padding:7px 14px;font:inherit;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.controls{display:flex;flex-wrap:wrap;gap:12px;margin:12px 0 16px;align-items:center}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:16px}
.kpi .v{font-size:22px;font-weight:650;letter-spacing:-.01em;font-variant-numeric:tabular-nums;color:var(--accent)}
.kpi .v-sub{font-size:13px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .l{color:var(--muted);font-size:13px;font-weight:600}
.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media (min-width: 768px){
  .grid-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--muted);font-size:11px;font-family:inherit}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
th,td{padding:7px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:600;font-size:12px;position:sticky;top:0;background:var(--card)}
.scroll{overflow:auto;max-height:420px}
input[type=search], input[type=number], select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
input[type=number]{width:90px}
input[type=search]{min-width:200px}
a{color:var(--accent)}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);padding:5px 9px;border-radius:6px;font-size:12px;display:none;z-index:10;white-space:nowrap}
.note{color:var(--muted);font-size:12px;margin-top:10px}
.sim-box{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:12px}
.sim-res{font-size:18px;font-weight:600;color:var(--accent);margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Histórico das Loterias CAIXA</h1>
    <div class="sub" id="atualizado"></div>
  </header>
  
  <!-- Painel de Seleção de Loterias e Período -->
  <div class="filter-panel">
    <div class="filter-title">Selecione as Loterias para Analisar:</div>
    <div class="checkbox-group" id="lotteryCheckboxes">
      <label class="checkbox-item">
        <input type="checkbox" id="chkAll" checked> <strong>TODAS AS LOTERIAS</strong>
      </label>
    </div>
    
    <div class="year-filter">
      <span style="font-weight:600;font-size:13px;">Filtrar Período (Ano):</span>
      <label class="sub">De: <input type="number" id="anoDe" placeholder="Ex: 1994" min="1994" max="2100"></label>
      <label class="sub">Até: <input type="number" id="anoAte" placeholder="Ex: 2026" min="1994" max="2100"></label>
      <span class="sub">(Deixe em branco para todo o histórico)</span>
    </div>
  </div>

  <div id="banner"></div>
  <div id="app"></div>
  <div class="note" id="notas"></div>
</div>
<div class="tip" id="tip"></div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const brl = n => n.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const compact = n => {
  const a = Math.abs(n);
  if (a >= 1e9) return "R$ " + (n/1e9).toLocaleString("pt-BR",{maximumFractionDigits:1}) + " bi";
  if (a >= 1e6) return "R$ " + (n/1e6).toLocaleString("pt-BR",{maximumFractionDigits:1}) + " mi";
  if (a >= 1e3) return "R$ " + (n/1e3).toLocaleString("pt-BR",{maximumFractionDigits:0}) + " mil";
  return "R$ " + Math.round(n);
};
const fmtData = iso => iso ? iso.split("-").reverse().join("/") : "";

const state = { 
  loteriasLista: [],
  selectedSlugs: [],
  base: "corrigido", 
  per: "ano", 
  era: "todas", 
  d: null,
  anoDe: null,
  anoAte: null
};

async function getJSON(p){ const r = await fetch(p); if(!r.ok) throw new Error(p); return r.json(); }

const tip = $("#tip");
function bindTip(el, text){
  el.addEventListener("mousemove", e => { tip.textContent = text; tip.style.display="block";
    tip.style.left = (e.clientX+12)+"px"; tip.style.top = (e.clientY+12)+"px"; });
  el.addEventListener("mouseleave", () => tip.style.display="none");
}
function niceMax(v){ const p = Math.pow(10, Math.floor(Math.log10(v||1))); const m = v/p;
  return (m<=1?1:m<=2?2:m<=5?5:10)*p; }

function barChart(el, rows, series){
  const W=960,H=300,L=64,R=8,T=10,B=28, iw=W-L-R, ih=H-T-B;
  const totais = rows.map(r => r.valores.reduce((a,b)=>a+b,0));
  const max = niceMax(Math.max(...totais, 1));
  const y = v => T + ih - v/max*ih;
  const bw = iw/(rows.length||1), gap = Math.min(4, bw*.2);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img">`;
  for(let i=0;i<=4;i++){ const v=max/4*i, yy=y(v);
    s += `<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="var(--line)"/>`;
    s += `<text x="${L-6}" y="${yy+4}" text-anchor="end">${compact(v)}</text>`; }
  const passo = Math.ceil(rows.length/ Math.floor(iw/46));
  rows.forEach((r,i)=>{
    let acc=0; const x = L+i*bw+gap/2, w = Math.max(1,bw-gap);
    r.valores.forEach((v,k)=>{ if(v<=0) return;
      const y0=y(acc+v), h=y(acc)-y0; acc+=v;
      s += `<rect data-i="${i}" data-k="${k}" x="${x}" y="${y0}" width="${w}" height="${Math.max(h,0)}" fill="${series[k].cor}" rx="1.5"/>`; });
    if(i%passo===0) s += `<text x="${x+w/2}" y="${H-8}" text-anchor="middle">${r.label}</text>`;
  });
  s += `</svg>`;
  el.innerHTML = s;
  el.querySelectorAll("rect").forEach(rc => {
    const r = rows[+rc.dataset.i], k = +rc.dataset.k;
    bindTip(rc, `${r.label} · ${series[k].nome}: ${brl(r.valores[k])}` + (series.length>1 ? ` (total ${brl(r.valores.reduce((a,b)=>a+b,0))})`:""));
  });
}

function donutChart(el, items){
  const size=220, cx=110, cy=110, r=75, stroke=32;
  const total = items.reduce((a,b)=>a+b.val,0);
  let accumAngle = -Math.PI / 2;
  let s = `<svg viewBox="0 0 ${size} ${size}">`;
  
  items.forEach(it => {
    const sliceAngle = (total > 0 ? (it.val / total) : 0) * 2 * Math.PI;
    const x1 = cx + r * Math.cos(accumAngle);
    const y1 = cy + r * Math.sin(accumAngle);
    accumAngle += sliceAngle;
    const x2 = cx + r * Math.cos(accumAngle);
    const y2 = cy + r * Math.sin(accumAngle);
    const largeArc = sliceAngle > Math.PI ? 1 : 0;
    const pathData = `M ${x1} ${y1} A ${r} ${r} 0 ${largeArc} 1 ${x2} ${y2}`;
    s += `<path d="${pathData}" fill="none" stroke="${it.cor}" stroke-width="${stroke}" />`;
  });
  s += `<text x="${cx}" y="${cy-6}" text-anchor="middle" font-weight="bold" font-size="14">${compact(total)}</text>`;
  s += `<text x="${cx}" y="${cy+12}" text-anchor="middle" font-size="10" fill="var(--muted)">Arrecadação</text>`;
  s += `</svg>`;
  el.innerHTML = s;
}

function legend(el, series){
  el.innerHTML = series.length>1 ? series.map(s=>`<span><i style="background:${s.cor}"></i>${s.nome}</span>`).join("") : "";
}

function sufixo(){ return state.base==="corrigido" ? "_corrigido" : "_nominal"; }

function filtrarPorAnoEERA(lista){
  if(!Array.isArray(lista)) return [];
  return lista.filter(r => {
    const ano = parseInt(r.ano ?? r.mes ?? r.data);   // resumo por ano, por mês ou concurso (data)
    if(isNaN(ano)) return true;
    if(state.anoDe && ano < state.anoDe) return false;
    if(state.anoAte && ano > state.anoAte) return false;
    if(state.era === "pre" && ano > 2014) return false;
    if(state.era === "pos" && ano < 2015) return false;
    return true;
  });
}

function render(){
  if(!state.d) return;
  const d = state.d, suf = sufixo();
  const resumoBruto = state.per==="ano" ? d.ano : d.mes;
  const resumo = filtrarPorAnoEERA(resumoBruto);
  const chave = state.per==="ano" ? "ano" : "mes";
  
  const brutoSum = resumo.reduce((a,b)=>a+(b["bruto"+suf]||0),0);
  const irSum = resumo.reduce((a,b)=>a+(b["ir"+suf]||0),0);
  const brutoNominal = resumo.reduce((a,b)=>a+(b["bruto_nominal"]||0),0);
  const irNominal = resumo.reduce((a,b)=>a+(b["ir_nominal"]||0),0);

  const rotulo = state.base==="corrigido" ? "corrigido pela Selic" : "nominal";
  
  $("#kpis").innerHTML = [
    ["Prêmios Brutos Pagos", compact(brutoSum), "Valor Nominal: " + compact(brutoNominal), "Total pago nas faixas"],
    ["IRRF Arrecadado (União)", compact(irSum), "Valor Nominal: " + compact(irNominal), "Imposto de Renda retido"],
    ["Alíquota Efetiva de IR", (brutoSum? irSum/brutoSum*100:0).toFixed(1)+"%", "IRRF ÷ Prêmios Brutos", "Percentual sobre o prêmio"],
    ["Concursos Analisados", resumo.reduce((a,b)=>a+(b.concursos||0),0).toLocaleString("pt-BR"), "Loterias: " + state.selectedSlugs.join(", "), ""],
  ].map(([l,v,sub,t])=>`
    <div class="card kpi">
      <div class="l" title="${t}">${l}</div>
      <div class="v">${v}</div>
      <div class="v-sub">${sub}</div>
    </div>`).join("");

  $("#t1").textContent = `IR Arrecadado por ${state.per==="ano"?"Ano":"Mês"} (${rotulo})`;
  barChart($("#c1"), resumo.map(r=>({label:r[chave], valores:[r["ir"+suf]||0]})), [{nome:"IR Arrecadado", cor:"var(--accent-2)"}]);

  $("#t2").textContent = `Prêmios Brutos Pagos por ${state.per==="ano"?"Ano":"Mês"} (${rotulo})`;
  barChart($("#c2"), resumo.map(r=>({label:r[chave], valores:[r["bruto"+suf]||0]})), [{nome:"Bruto Pago", cor:"var(--c1)"}]);
  legend($("#l2"), []);

  const arrecEst = brutoSum / 0.4335;
  const repassesEst = arrecEst * 0.48;
  const custosEst = arrecEst * 0.20;
  
  donutChart($("#c-donut"), [
    { nome: "Prêmios Líquidos", val: Math.max(0, brutoSum - irSum), cor: "var(--c1)" },
    { nome: "Repasses Sociais (Governo)", val: repassesEst, cor: "var(--c3)" },
    { nome: "IRRF (União)", val: irSum, cor: "var(--c2)" },
    { nome: "Custo Operacional & Lotéricas", val: custosEst, cor: "var(--c5)" }
  ]);
  legend($("#l-donut"), [
    { nome: "Prêmios Líquidos (31%)", cor: "var(--c1)" },
    { nome: "Repasses Sociais (48%)", cor: "var(--c3)" },
    { nome: "IRRF na Fonte (13%)", cor: "var(--c2)" },
    { nome: "Custos & Lotéricas (20%)", cor: "var(--c5)" }
  ]);

  $("#tp-h").innerHTML = `<tr><th>${state.per==="ano"?"Ano":"Mês"}</th><th>Concursos</th><th>Bruto Pago (${state.base})</th><th>IR Arrecadado (${state.base})</th><th>Alíq. IR</th></tr>`;
  $("#tp-b").innerHTML = [...resumo].reverse().map(r=>{
    const b=r["bruto"+suf]||0, i=r["ir"+suf]||0;
    return `<tr><td>${r[chave]}</td><td>${r.concursos||0}</td><td>${brl(b)}</td><td>${brl(i)}</td><td>${b?(i/b*100).toFixed(1):"0.0"}%</td></tr>`; }).join("");
    
  $("#tl-b").innerHTML = (state.d.porLoteria || []).map(l => {
    const rows = filtrarPorAnoEERA(l.ano);
    const b = rows.reduce((a,r)=>a+(r["bruto"+suf]||0),0), i = rows.reduce((a,r)=>a+(r["ir"+suf]||0),0);
    return {nome:l.nome, c:rows.reduce((a,r)=>a+(r.concursos||0),0), b, i};
  }).filter(l => l.c > 0).sort((a,b)=>b.b-a.b).map(l =>
    `<tr><td>${l.nome}</td><td>${l.c.toLocaleString("pt-BR")}</td><td>${brl(l.b)}</td><td>${brl(l.i)}</td><td>${l.b?(l.i/l.b*100).toFixed(1):"0.0"}%</td></tr>`).join("")
    || `<tr><td colspan="5" class="empty">Sem dados no período</td></tr>`;

  renderConcursos();
  renderSimulador();
}

function renderConcursos(){
  const suf = sufixo(), q = ($("#busca")?.value||"").trim();
  let rows = filtrarPorAnoEERA(state.d?.concursos || []);
  if(q) rows = rows.filter(r => String(r.concurso).includes(q) || fmtData(r.data).includes(q));
  rows = [...rows].reverse().slice(0,200);
  $("#tc-b").innerHTML = rows.map(r=>`<tr><td>${r.loteria||""}</td><td>${r.concurso}</td><td>${fmtData(r.data)}</td><td>${brl(r["bruto"+suf]||0)}</td><td>${brl(r["ir"+suf]||0)}</td></tr>`).join("")
    || `<tr><td colspan="5" class="empty">Nenhum concurso encontrado</td></tr>`;
}

function renderSimulador(){
  const selAno = $("#simAno");
  if(!selAno || !state.d || !state.d.ano) return;
  const anos = state.d.ano.map(a => a.ano).sort((a,b)=>b-a);
  selAno.innerHTML = anos.map(a => `<option value="${a}">${a}</option>`).join("");
  calcSimulacao();
}

function calcSimulacao(){
  const anoVal = parseInt($("#simAno")?.value);
  const valVal = parseFloat($("#simVal")?.value || 0);
  if(!anoVal || !valVal || !state.d) return;
  
  const regAno = state.d.ano.find(a => a.ano === anoVal);
  if(!regAno || !regAno.bruto_nominal) return;
  
  const fator = regAno.bruto_corrigido / regAno.bruto_nominal;
  const valCorrigido = valVal * fator;
  
  $("#simRes").innerHTML = `O prêmio de <strong>${brl(valVal)}</strong> em ${anoVal} equivale a aproximadamente <br><span style="font-size:22px">${brl(valCorrigido)}</span> a valores presentes (corrigido pela Selic).`;
}

function esqueleto(){
  $("#app").innerHTML = `
    <div class="controls">
      <div class="seg" id="sBase">
        <button data-v="corrigido" aria-pressed="true">Corrigido (Selic)</button>
        <button data-v="nominal" aria-pressed="false">Nominal</button>
      </div>
      <div class="seg" id="sPer">
        <button data-v="ano" aria-pressed="true">Por Ano</button>
        <button data-v="mes" aria-pressed="false">Por Mês</button>
      </div>
      <div class="seg" id="sEra">
        <button data-v="todas" aria-pressed="true">Todas as Eras</button>
        <button data-v="pre" aria-pressed="false">Pré-2015</button>
        <button data-v="pos" aria-pressed="false">Pós-2015</button>
      </div>
    </div>
    
    <div class="kpis" id="kpis"></div>
    
    <div class="grid">
      <div class="grid-2col">
        <div class="card">
          <h2>Distribuição Estimada da Arrecadação</h2>
          <div id="c-donut" style="display:flex;justify-content:center;margin:10px 0;"></div>
          <div class="legend" id="l-donut"></div>
          <p class="note">Estimativa com percentuais fixos sobre o prêmio bruto; não usa a arrecadação real de cada concurso e varia entre loterias.</p>
        </div>
        <div class="card">
          <h2>Simulador de Correção de Prêmios</h2>
          <p class="sub">Descubra quanto um prêmio recebido no passado valeria hoje:</p>
          <div class="sim-box">
            <div>
              <label class="sub">Ano do Sorteio:</label><br>
              <select id="simAno" style="margin-top:4px;"></select>
            </div>
            <div>
              <label class="sub">Valor Recebido (R$):</label><br>
              <input type="number" id="simVal" value="1000000" step="50000" style="margin-top:4px;width:140px;">
            </div>
          </div>
          <div class="sim-res" id="simRes"></div>
        </div>
      </div>

      <div class="card"><h2 id="t1"></h2><div id="c1"></div></div>
      <div class="card"><h2 id="t2"></h2><div id="c2"></div><div class="legend" id="l2"></div></div>
      <div class="card"><h2>Totais por Loteria <span class="sub">(respeita o filtro de período)</span></h2>
        <div class="scroll"><table><thead><tr><th>Loteria</th><th>Concursos</th><th>Bruto Pago</th><th>IR Arrecadado</th><th>Alíq. IR</th></tr></thead><tbody id="tl-b"></tbody></table></div></div>
      <div class="card"><h2>Resumo por Período</h2><div class="scroll"><table><thead id="tp-h"></thead><tbody id="tp-b"></tbody></table></div></div>
      <div class="card"><h2>Concursos <span class="sub">(últimos 200 / busca por nº ou data)</span></h2>
        <p style="margin:0 0 8px"><input type="search" id="busca" placeholder="Buscar concurso ou data…"></p>
        <div class="scroll"><table><thead><tr><th>Loteria</th><th>Concurso</th><th>Data</th><th>Bruto Pago</th><th>IR Arrecadado</th></tr></thead><tbody id="tc-b"></tbody></table></div></div>
    </div>`;

  for(const [id,key] of [["#sBase","base"],["#sPer","per"],["#sEra","era"]]){
    $(id).addEventListener("click", e => { const b = e.target.closest("button"); if(!b) return;
      state[key] = b.dataset.v; $(id).querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed", x===b)); render(); });
  }
  
  $("#busca")?.addEventListener("input", renderConcursos);
  $("#simAno")?.addEventListener("change", calcSimulacao);
  $("#simVal")?.addEventListener("input", calcSimulacao);
}

// Carrega e consolida dados de múltiplas loterias simultaneamente
async function carregarSelecionadas(){
  if(!state.selectedSlugs.length) return;
  
  const loteriasDados = [];
  for(const slug of state.selectedSlugs){
    const tentativas = [`data/${slug}/`, `docs/data/${slug}/`, `./data/${slug}/`];
    for(const path of tentativas){
      try{
        const [meta, ano, mes, faixa, concursos] = await Promise.all(
          ["meta","resumo_ano","resumo_mes","resumo_ano_faixa","concursos"].map(n=>getJSON(path+n+".json")));
        loteriasDados.push({meta, ano, mes, faixa, concursos});
        break;
      }catch(e){ continue; }
    }
  }

  if(!loteriasDados.length){
    $("#app").innerHTML = `<div class="card empty">Selecione ao menos uma loteria com dados disponíveis.</div>`;
    return;
  }

  // Agrega dados de todas as loterias selecionadas
  const anoMap = {}, mesMap = {}, concursosList = [];
  loteriasDados.forEach(d => {
    (d.ano || []).forEach(r => {
      if(!anoMap[r.ano]) anoMap[r.ano] = {ano: r.ano, concursos:0, bruto_corrigido:0, bruto_nominal:0, ir_corrigido:0, ir_nominal:0};
      anoMap[r.ano].concursos += r.concursos || 0;
      anoMap[r.ano].bruto_corrigido += r.bruto_corrigido || 0;
      anoMap[r.ano].bruto_nominal += r.bruto_nominal || 0;
      anoMap[r.ano].ir_corrigido += r.ir_corrigido || 0;
      anoMap[r.ano].ir_nominal += r.ir_nominal || 0;
    });
    (d.mes || []).forEach(r => {
      if(!mesMap[r.mes]) mesMap[r.mes] = {mes: r.mes, concursos:0, bruto_corrigido:0, bruto_nominal:0, ir_corrigido:0, ir_nominal:0};
      mesMap[r.mes].concursos += r.concursos || 0;
      mesMap[r.mes].bruto_corrigido += r.bruto_corrigido || 0;
      mesMap[r.mes].bruto_nominal += r.bruto_nominal || 0;
      mesMap[r.mes].ir_corrigido += r.ir_corrigido || 0;
      mesMap[r.mes].ir_nominal += r.ir_nominal || 0;
    });
    (d.concursos || []).forEach(c => concursosList.push({...c, loteria: d.meta.nome}));
  });

  state.d = {
    meta: loteriasDados[0].meta,
    ano: Object.values(anoMap).sort((a,b)=>a.ano-b.ano),
    mes: Object.values(mesMap).sort((a,b)=>a.mes.localeCompare(b.mes)),
    concursos: concursosList.sort((a,b)=> (a.data < b.data ? -1 : a.data > b.data ? 1 : a.concurso - b.concurso)),
    porLoteria: loteriasDados.map(d => ({nome: d.meta.nome, ano: d.ano || []}))
  };

  const maisRecente = loteriasDados.map(d => d.meta.atualizado_em).sort().pop();
  $("#atualizado").textContent = `Atualizado em ${new Date(maisRecente).toLocaleString("pt-BR")} · Selic até ${fmtData(loteriasDados[0].meta.selic_ate)}`;

  // aviso: regras de IR ainda nao conferidas (por loteria e periodo)
  const avisos = loteriasDados.flatMap(d => (d.meta.regras_ir_pendentes || []).map(p =>
    `${d.meta.nome}: ${fmtData(p.de)}${p.ate ? " a " + fmtData(p.ate) : " em diante"}`));
  $("#banner").innerHTML = avisos.length
    ? `<div class="banner"><b>Atenção:</b> o limite de isenção do IR ainda não foi conferido com a legislação em: ${avisos.join("; ")}. O IR desses períodos é provisório.</div>`
    : "";
  esqueleto(); 
  render();
}

function renderCheckboxes(){
  const container = $("#lotteryCheckboxes");
  let html = `
    <label class="checkbox-item">
      <input type="checkbox" id="chkAll" ${state.selectedSlugs.length === state.loteriasLista.length ? "checked" : ""}> 
      <strong>TODAS AS LOTERIAS</strong>
    </label>
  `;
  
  state.loteriasLista.forEach(l => {
    const isChecked = state.selectedSlugs.includes(l.slug);
    html += `
      <label class="checkbox-item">
        <input type="checkbox" class="chkLot" data-slug="${l.slug}" ${isChecked ? "checked" : ""}> ${l.nome}
      </label>
    `;
  });
  
  container.innerHTML = html;

  // Event Listeners dos Checkboxes
  $("#chkAll").addEventListener("change", e => {
    const isChecked = e.target.checked;
    document.querySelectorAll(".chkLot").forEach(c => c.checked = isChecked);
    state.selectedSlugs = isChecked ? state.loteriasLista.map(l => l.slug) : [];
    carregarSelecionadas();
  });

  document.querySelectorAll(".chkLot").forEach(chk => {
    chk.addEventListener("change", () => {
      const selected = Array.from(document.querySelectorAll(".chkLot:checked")).map(c => c.dataset.slug);
      state.selectedSlugs = selected;
      $("#chkAll").checked = (selected.length === state.loteriasLista.length);
      carregarSelecionadas();
    });
  });
}

(async function init(){
  let lista=[]; 
  const caminhosMeta = ["data/loterias.json", "docs/data/loterias.json", "./data/loterias.json"];
  for(const p of caminhosMeta){
    try{ lista = await getJSON(p); if(lista.length) break; }catch(e){}
  }
  
  if(!lista.length){ 
    $("#app").innerHTML = `<div class="card empty">Carregando dados das loterias…</div>`; 
    return; 
  }
  
  state.loteriasLista = lista;
  state.selectedSlugs = lista.map(l => l.slug); // Padrão: Todas selecionadas
  
  renderCheckboxes();
  
  // Event listeners dos inputs de ano
  $("#anoDe").addEventListener("input", e => {
    state.anoDe = e.target.value ? parseInt(e.target.value) : null;
    render();
  });
  
  $("#anoAte").addEventListener("input", e => {
    state.anoAte = e.target.value ? parseInt(e.target.value) : null;
    render();
  });

  carregarSelecionadas();
})();
</script>
</body>
</html>

name: Diagnóstico Super Sete (temporário)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Caixa - variações do endereço
        run: |
          UA="Mozilla/5.0 (historico-loterias)"
          for u in \
            "https://servicebus2.caixa.gov.br/portaldeloterias/api/supersete" \
            "https://servicebus2.caixa.gov.br/portaldeloterias/api/supersete/1" \
            "https://servicebus2.caixa.gov.br/portaldeloterias/api/supersete/800" \
            "https://servicebus2.caixa.gov.br/portaldeloterias/api/super-sete" \
            "https://servicebus2.caixa.gov.br/portaldeloterias/api/lotofacil" ; do
            echo "=== $u"
            curl -sS -m 30 -A "$UA" -H "Accept: application/json" -o /tmp/r.txt -w "http=%{http_code} bytes=%{size_download} tipo=%{content_type}\n" "$u" || echo "curl falhou"
            head -c 400 /tmp/r.txt; echo
          done
      - name: Espelho público (guilhermeasn/loteria.json)
        run: |
          curl -sS -m 60 -o /tmp/ss.json -w "http=%{http_code} bytes=%{size_download}\n" https://raw.githubusercontent.com/guilhermeasn/loteria.json/master/data/supersete.json
          python3 - <<'PY'
          import json
          d = json.load(open("/tmp/ss.json"))
          ks = list(d) if isinstance(d, dict) else None
          print(type(d).__name__, len(d), (ks[:2], ks[-2:]) if ks else "")
          first = d[ks[0]] if ks else d[0]; last = d[ks[-1]] if ks else d[-1]
          print("PRIMEIRO:", json.dumps(first, ensure_ascii=False)[:800])
          print("ULTIMO:", json.dumps(last, ensure_ascii=False)[:1200])
          PY

name: Atualizar loterias

on:
  schedule:
    - cron: "0 3 * * *"   # 03:00 UTC = 00:00 em Brasília
  workflow_dispatch:       # botão "Run workflow" para rodar na hora

permissions:
  contents: write

concurrency:
  group: atualizar
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Baixar dados novos e recalcular
        run: python scripts/update.py

      - name: Publicar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data
          if git diff --cached --quiet; then
            echo "Sem alterações."
          else
            git commit -m "Atualiza dados ($(date -u +%F))"
            git push
          fi

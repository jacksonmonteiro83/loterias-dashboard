name: Diagnostico Super Sete (temporario)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - name: Procurar o botao de download na pagina
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
          curl -sS -L -m 60 -A "$UA" "https://loterias.caixa.gov.br/Paginas/Super-sete.aspx" -o pagina.html
          echo "== linhas com download/xlsx/crescente"
          grep -in 'download\|xlsx\|crescente\|baixar' pagina.html | cut -c1-300 | head -40
          echo "== scripts da pagina"
          grep -io 'src="[^"]*\.js[^"]*"' pagina.html | head -30
      - name: Testar enderecos candidatos
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
          for u in \
            "https://loterias.caixa.gov.br/Paginas/Download-Resultados.aspx?modalidade=Super-Sete" \
            "https://servicebus2.caixa.gov.br/portaldeloterias/api/resultados?modalidade=Super+Sete" \
            "https://servicebus2.caixa.gov.br/portaldeloterias/api/resultados/download?modalidade=Super+Sete&ordem=crescente" \
            "https://servicebus3.caixa.gov.br/portaldeloterias/api/resultados/download?modalidade=Super+Sete" \
            "https://loterias.caixa.gov.br/Documents/Recursos/Download/Super_Sete.xlsx" \
            "https://servicebus2.caixa.gov.br/portaldeloterias/api/supersete/1" ; do
            echo "== $u"
            curl -sS -L -m 60 -A "$UA" -o /tmp/x.bin -w "http=%{http_code} tipo=%{content_type} bytes=%{size_download}\n" "$u" || echo falhou
            head -c 200 /tmp/x.bin | strings | head -2
          done

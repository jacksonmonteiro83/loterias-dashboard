name: Diagnostico Super Sete (temporario)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - name: Ler o JS do botao de download
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
          B="https://loterias.caixa.gov.br"
          curl -sS -L -m 60 -A "$UA" "$B/style%20library/js/webparts/download-resultados.js" -o dl.js -w "http=%{http_code} bytes=%{size_download}\n"
          echo "==== download-resultados.js"; head -c 6000 dl.js
          echo; echo "==== candidatos"
          for u in \
            "https://servicebus2.caixa.gov.br/portaldeloterias/api/supersete/download-resultados" \
            "https://servicebus2.caixa.gov.br/portaldeloterias/api/download-resultados?modalidade=supersete" \
            "https://servicebus2.caixa.gov.br/portaldeloterias/api/resultados/download-resultados?modalidade=supersete" ; do
            echo "== $u"
            curl -sS -L -m 90 -A "$UA" -o x.bin -w "http=%{http_code} tipo=%{content_type} bytes=%{size_download}\n" "$u" || echo falhou
            head -c 300 x.bin | strings | head -3
          done

name: Diagnostico Super Sete (temporario)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - name: Descobrir a URL da API que a pagina usa
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
          curl -sS -m 60 -A "$UA" "https://loterias.caixa.gov.br/style%20library/js/loterias-caixa.js" -o lc.js
          sed -n 1,40p lc.js | cut -c1-250
          echo "==== urls no JS"; grep -o "'[^']*\(_api\|/Paginas\|\.json\|parametro\)[^']*'\|\"[^\"]*\(_api\|\.json\|parametro\)[^\"]*\"" lc.js | sort -u | head -20
